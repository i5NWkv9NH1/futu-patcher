[package]
name = "futu-patcher"
version = "0.1.0"
edition = "2024"
authors = ["sora"]
description = "macOS 富途客户端 (Futubull / FutuNiuniu) 净化与瘦身工具"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
walkdir = "2.5"
thiserror = "1.0"
libc = "0.2"
